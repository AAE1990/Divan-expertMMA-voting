# version: '2.38'

services:
    db:
        container_name: postgres_db
        image: postgres:latest
        restart: always
        env_file:
            - ./nestjs-server/.env
        environment:
            - POSTGRES_USER=${MYSQL_USER}
            - POSTGRES_PASSWORD=${MYSQL_PASSWORD}
            - POSTGRES_DB=${MYSQL_DB}
        ports:
            - 5434:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - backend

    redis:
        container_name: redis
        image: redis:7.0
        restart: always
        env_file:
            - ./nestjs-server/.env
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - 6380:6379
        volumes:
            - redis_data:/data
        networks:
            - backend

    backend:
        image: node:20-alpine
        container_name: couch_expert_api
        restart: always
        ports:
          - "443:4000"
        working_dir: /app
        volumes:
          - ./nestjs-server:/app
          - /etc/letsencrypt:/etc/letsencrypt:ro
        env_file:
          - ./nestjs-server/.env
        environment:
          - PORT=4000
        command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npm run start:prod"
        depends_on:
          - db
          - redis
        networks:
          - backend
    
volumes:
    postgres_data:
    redis_data:

networks:
    backend:
