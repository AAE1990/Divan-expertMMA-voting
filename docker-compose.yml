version: '3.8'

services:
  db:
    container_name: postgres_db
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./nestjs-server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    container_name: redis
    image: redis:7.0
    restart: always
    env_file:
      - ./nestjs-server/.env
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  backend:
    image: node:20-alpine
    container_name: couch_expert_api
    restart: always
    ports:
      - "4000:4000"
    working_dir: /app
    volumes:
      - ./nestjs-server:/app
      - './etc/letsencrypt/archive/api.couch-expert-mma.com/privkey1.pem:/etc/letsencrypt/live/api.couch-expert-mma.com/privkey.pem:ro'
      - './etc/letsencrypt/archive/api.couch-expert-mma.com/fullchain1.pem:/etc/letsencrypt/live/api.couch-expert-mma.com/fullchain.pem:ro'
    environment:
      - PORT=4000
      - DATABASE_URL=${MYSQL_URI}
      - MYSQL_URI=${MYSQL_URI}
    env_file:
      - ./nestjs-server/.env
    command: sh -c "npm install --legacy-peer-deps && npx prisma@6.2.1 generate && ./node_modules/.bin/nest start"
    depends_on:
      - db
      - redis
    networks:
      - backend

  frontend:
    build:
      context: ./nextjs-client # путь к папке с Next.js
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.couch-expert-mma.com
    ports:
      - "3000:3000" # Фронтенд будет слушать порт 3000 снаружи Docker
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.couch-expert-mma.com

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
