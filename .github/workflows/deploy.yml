name: Deploy NestJS Backend to VPS

on:
  push:
    branches:
      - main  # Сценарий сработает, когда ты делаешь пуш в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переходим в корень сервера
            cd /root
            
            # На всякий случай устанавливаем git, если его нет в системе
            if ! command -v git &> /dev/null; then
              apt update && apt install git -y
            fi
            
            # Чистое клонирование репозитория по твоей прямой ссылке
            if [ ! -d "couch-expert-backend" ]; then
              git clone https://github.com/AAE1990/Divan-expertMMA-voting.git couch-expert-backend
            fi
            
            # Переходим внутрь проекта
            cd /root/couch-expert-backend
            
            # Стягиваем свежие изменения
            git fetch --all
            git reset --hard origin/main
            
            # Перезапускаем сборку Docker контейнеров
            docker compose down
            docker compose up -d --build
